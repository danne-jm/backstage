apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-deployment
  namespace: default
  labels:
    app: backstage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage-app
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 82
          # Replace YOUR_DOCKERHUB_USERNAME with your actual Docker Hub username
          image: danieljaurellmevorachsasm2425/backstage-v2:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /up
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - secretRef:
                name: backstage-secrets
